<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WRAL Weather Image</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; }
    img { max-width: 100%; max-height: 100vh; display: block; }
    .error { color: tomato; font-family: sans-serif; font-size: 0.9rem; padding: 1rem; }
  </style>
</head>
<body>
  <script>
    const slug = new URLSearchParams(location.search).get("slug");
    if (!slug) {
      document.body.innerHTML = '<p class="error">Missing ?slug= parameter</p>';
    } else {
      // After deploying worker.js to Cloudflare Workers, replace this URL:
      const WORKER = "https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev";
      fetch(WORKER + "/?json=1&slug=" + encodeURIComponent(slug))
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(json => {
          const img = document.createElement("img");
          img.src = json.data.frames[0].url;
          img.alt = slug;
          document.body.appendChild(img);
        })
        .catch(e => {
          document.body.innerHTML = '<p class="error">Failed to load ' + slug + ': ' + e.message + '</p>';
        });
    }
  </script>
</body>
</html>
